<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModernArt Responsive QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #23211d; }
      body { display: grid; place-items: center; }
      #stage { transform-origin: center; box-shadow: 0 24px 80px rgba(0, 0, 0, .55); }
      iframe { display: block; border: 0; background: #0d0c0a; }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="app" title="ModernArt responsive preview"></iframe></div>
    <script>
      const params = new URLSearchParams(location.search)
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value))
      const width = clamp(Number(params.get('width')) || 390, 320, 1600)
      const height = clamp(Number(params.get('height')) || 844, 480, 1200)
      const requestedPath = params.get('path') || '/'
      const path = requestedPath.startsWith('/') ? requestedPath : '/'
      const stage = document.querySelector('#stage')
      const frame = document.querySelector('#app')

      frame.width = String(width)
      frame.height = String(height)
      frame.src = path

      const fit = () => {
        const scale = Math.min((innerWidth - 32) / width, (innerHeight - 32) / height, 1)
        stage.style.width = `${width}px`
        stage.style.height = `${height}px`
        stage.style.transform = `scale(${scale})`
      }
      addEventListener('resize', fit)
      fit()
    </script>
  </body>
</html>
